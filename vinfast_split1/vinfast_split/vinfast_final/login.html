<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập – VinFast</title>
  <link rel="stylesheet" href="shared.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-logo"><a href="index.html" style="text-decoration:none;"><span class="logo-text">VinFast</span></a></div>
      <div class="auth-title">Chào mừng trở lại!</div>
      <div class="auth-sub">Đăng nhập để tiếp tục hành trình xanh cùng VinFast</div>

      <div class="social-login">
        <button class="social-login-btn">🇬 Google</button>
        <button class="social-login-btn">f Facebook</button>
      </div>

      <div class="divider">
        <div class="divider-line"></div>
        <div class="divider-text">hoặc đăng nhập bằng email</div>
        <div class="divider-line"></div>
      </div>

      <div class="form-group">
        <label class="form-label">Email hoặc số điện thoại</label>
        <input type="text" class="form-input" placeholder="email@example.com hoặc 0901234567">
      </div>
      <div class="form-group">
        <label class="form-label">Mật khẩu</label>
        <div class="show-pass">
          <input type="password" class="form-input" id="pwInput" placeholder="Nhập mật khẩu">
          <button class="eye-btn" onclick="togglePw()">👁️</button>
        </div>
      </div>

      <div class="remember-row">
        <label class="checkbox-label"><input type="checkbox" checked> Ghi nhớ đăng nhập</label>
        <a href="forgot-password.html" class="forgot-link">Quên mật khẩu?</a>
      </div>

      <button class="login-btn" onclick="alert('Đăng nhập thành công!')">Đăng nhập</button>

      <div class="auth-footer">
        Chưa có tài khoản? <a href="register.html">Đăng ký ngay</a>
      </div>
    </div>
  </div>
</body>
</html>
